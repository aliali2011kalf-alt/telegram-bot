<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANF Airdrop</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #151c32;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #9da8c5;
      margin-bottom: 25px;
    }

    .balance {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      margin: 15px 0;
    }

    .coin {
      text-align: center;
      color: #9da8c5;
    }

    .mining {
      text-align: center;
    }

    .mining-rate {
      font-size: 20px;
      margin: 10px 0;
    }

    .claimable {
      font-size: 28px;
      font-weight: bold;
      margin: 15px 0;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      margin-top: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #2ea6ff;
      color: white;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .secondary {
      background: #26314f;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #293451;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .status {
      text-align: center;
      color: #9da8c5;
      margin-top: 12px;
      min-height: 20px;
    }

    .success {
      color: #45e39a;
    }

    .error {
      color: #ff6b6b;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <h1>🚀 ANF</h1>
    <div class="subtitle">ANF Airdrop Platform</div>

    <div class="balance" id="balance">0.00</div>
    <div class="coin">ANF</div>
  </div>

  <div class="card mining">

    <h2>⛏️ التعدين</h2>

    <div class="mining-rate">
      0.01 ANF / ثانية
    </div>

    <div class="claimable" id="claimable">
      0.00000000 ANF
    </div>

    <div id="miningStatus">
      جاري التحقق...
    </div>

    <button id="startBtn" onclick="startMining()">
      🚀 بدء التعدين
    </button>

    <button id="claimBtn" onclick="claimMining()" disabled>
      💰 استلام الأرباح
    </button>

    <div class="status" id="message"></div>

  </div>

  <div class="card">

    <h2>👤 الحساب</h2>

    <div class="row">
      <span>المستخدم</span>
      <span id="username">-</span>
    </div>

    <div class="row">
      <span>Telegram ID</span>
      <span id="telegramId">-</span>
    </div>

    <div class="row">
      <span>كود الإحالة</span>
      <span id="referralCode">-</span>
    </div>

  </div>

  <div class="card">

    <h2>🎯 المهام</h2>

    <button class="secondary">
      📋 المهام قريبًا
    </button>

  </div>

  <div class="card">

    <h2>👥 الإحالات</h2>

    <button class="secondary">
      🔗 نظام الإحالة قريبًا
    </button>

  </div>

  <div class="card">

    <h2>💸 السحب</h2>

    <button class="secondary">
      💰 السحب قريبًا
    </button>

  </div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const API_URL =
  "https://oejaiweclbxbwqikaznn.supabase.co/functions/v1/anf-api";

const initData = tg.initData;

let claimable = 0;
let miningActive = false;
let ratePerSecond = 0.01;

function setMessage(text, type = "") {

  const el = document.getElementById("message");

  el.textContent = text;
  el.className = "status " + type;
}

async function api(action) {

  if (!initData) {
    throw new Error(
      "يجب فتح التطبيق من داخل Telegram"
    );
  }

  const response = await fetch(API_URL, {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      action: action,
      initData: initData
    })

  });

  const data = await response.json();

  if (!response.ok || data.success === false) {

    throw new Error(
      data.error || "حدث خطأ في الاتصال"
    );

  }

  return data;
}

function updateUI(data) {

  if (!data) return;

  const profile =
    data.profile ||
    data.user ||
    data;

  if (profile.balance !== undefined) {

    document.getElementById("balance")
      .textContent =
      Number(profile.balance).toFixed(8);

  }

  if (profile.username !== undefined) {

    document.getElementById("username")
      .textContent =
      profile.username
        ? "@" + profile.username
        : "-";

  }

  if (profile.telegram_id !== undefined) {

    document.getElementById("telegramId")
      .textContent =
      profile.telegram_id;

  }

  if (profile.referral_code !== undefined) {

    document.getElementById("referralCode")
      .textContent =
      profile.referral_code || "-";

  }

}

async function loadStatus() {

  try {

    const result =
      await api("status");

    updateUI(result);

    const status =
      result.status ||
      result.data ||
      result;

    if (status.claimable !== undefined) {

      claimable =
        Number(status.claimable);

    }

    if (status.rate_per_second !== undefined) {

      ratePerSecond =
        Number(status.rate_per_second);

    }

    miningActive =
      Boolean(
        status.active
      );

    renderMining();

  } catch (error) {

    setMessage(
      error.message,
      "error"
    );

    document.getElementById(
      "miningStatus"
    ).textContent =
      "تعذر تحميل حالة التعدين";

  }

}

function renderMining() {

  document.getElementById(
    "claimable"
  ).textContent =
    claimable.toFixed(8) +
    " ANF";

  document.getElementById(
    "claimBtn"
  ).disabled =
    claimable <= 0;

  document.getElementById(
    "startBtn"
  ).disabled =
    miningActive;

  document.getElementById(
    "miningStatus"
  ).textContent =
    miningActive
      ? "🟢 التعدين يعمل"
      : "⚪ التعدين متوقف";

}

async function startMining() {

  try {

    setMessage(
      "جاري بدء التعدين..."
    );

    const result =
      await api("start");

    miningActive = true;

    updateUI(result);

    setMessage(
      "تم بدء دورة التعدين لمدة 24 ساعة ✅",
      "success"
    );

    await loadStatus();

  } catch (error) {

    setMessage(
      error.message,
      "error"
    );

  }

}

async function claimMining() {

  try {

    if (claimable <= 0) {

      setMessage(
        "لا توجد أرباح للاستلام حاليًا"
      );

      return;

    }

    document.getElementById(
      "claimBtn"
    ).disabled = true;

    setMessage(
      "جاري استلام الأرباح..."
    );

    const result =
      await api("claim");

    const reward =
      Number(result.reward || 0);

    claimable = 0;

    if (result.profile) {
      updateUI(result);
    }

    setMessage(
      "تم استلام " +
      reward.toFixed(8) +
      " ANF ✅",
      "success"
    );

    await loadStatus();

  } catch (error) {

    setMessage(
      error.message,
      "error"
    );

    renderMining();

  }

}

setInterval(() => {

  if (miningActive) {

    claimable += ratePerSecond;

    renderMining();

  }

}, 1000);

setInterval(() => {

  loadStatus();

}, 30000);

loadStatus();

</script>

</body>
</html>
